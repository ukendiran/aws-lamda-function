# ============================================================
# AWS Lambda Functions - Deployment (Dev + Staging + Prod)
#
# Purpose:
#   - Manual deployment only
#   - Choose environment (dev | staging | prod) via workflow_dispatch
#   - Deploy only affected Lambda functions
#   - Detect ANY file change inside a Lambda folder
#   - Allow explicit function override
#   - Allow explicit base ref/SHA
#   - Generate an accurate deployment summary
#
# Flow (in order):
#   1. Checkout
#   2. Setup gh CLI
#   3. Set up Python
#   4. Resolve comparison base         (git-only)
#   5. Detect changed functions        (git-only)
#   6. Resolve environment credentials (reads secrets, no AWS call)
#   7. ONLY IF changes exist:
#        - Configure AWS credentials (OIDC)   ← first AWS call
#        - Verify AWS identity
#        - Deploy functions
#   8. Summary (always)
#
# Important:
#   - Does NOT use GitHub Environments.
#   - Secrets are repository-level only.
#   - The `environment` input is used purely as a switch-case selector.
#   - AWS authentication uses OIDC (no long-lived keys).
#
# Required repository secrets:
#   - AWS_ROLE_ARN          (shared, OIDC role)
#   - AWS_REGION_DEV        (e.g. ap-south-1)
#   - AWS_REGION_STAGING    (e.g. ap-south-1)
#   - AWS_REGION_PROD       (e.g. ap-south-1)
#
# Required repository layout:
#   <FunctionName>/
#     lambda_function.py     (discovery marker)
#     requirements.txt       (optional)
#     ...any other files
#
# A top-level folder is treated as a Lambda function ONLY IF it
# contains lambda_function.py. ANY changed file inside such a
# folder triggers deployment of that function.
# ============================================================

name: Deploy Lambda Functions

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev

      functions:
        description: >-
          Optional comma-separated function folder names to deploy.
          Example: HelloWorld,S3ListBuckets
        required: false
        type: string
        default: ""

      base:
        description: >-
          Optional base ref/SHA for change detection.
          Leave empty to use the last successful deployment of this workflow
          on the selected branch and environment.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy:
    name: Detect and Deploy Lambda Functions (${{ inputs.environment }})
    runs-on: windows-latest

    # ⚠️ IMPORTANT: No `environment:` key here.
    # Secrets are read from repository secrets, not GitHub Environments.

    env:
      INPUT_ENVIRONMENT: ${{ inputs.environment }}
      INPUT_FUNCTIONS:   ${{ inputs.functions }}
      INPUT_BASE:        ${{ inputs.base }}

      BRANCH_NAME:       ${{ github.ref_name }}
      COMMIT_SHA:        ${{ github.sha }}

    steps:
      # ========================================================
      # 1. Checkout
      # ========================================================

      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # ========================================================
      # 2. Setup GitHub CLI (used for base resolution)
      # ========================================================

      - name: Setup GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          gh --version

      # ========================================================
      # 3. Setup Python
      # ========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ========================================================
      # 4. Resolve comparison base  (git-only — no AWS)
      # ========================================================

      - name: Resolve comparison base
        id: base
        if: ${{ env.INPUT_FUNCTIONS == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Resolving comparison base"
          echo "=============================================="

          BASE=""

          # ------------------------------------------------------
          # 4.1 Manual base supplied
          # ------------------------------------------------------

          if [ -n "$INPUT_BASE" ]; then
            echo "Using manually supplied base:"
            echo "$INPUT_BASE"

            BASE="$INPUT_BASE"

            git fetch --all --tags --prune

            if ! git rev-parse --verify "$BASE^{commit}" >/dev/null 2>&1; then
              echo ""
              echo "ERROR: Base ref/SHA does not exist:"
              echo "$BASE"
              exit 1
            fi

          else
            # ----------------------------------------------------
            # 4.2 Last successful deployment for THIS environment
            # ----------------------------------------------------

            echo "No base supplied."
            echo "Finding the last successful deployment for environment:"
            echo "$INPUT_ENVIRONMENT"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Branch  : $BRANCH_NAME"

            LAST_SUCCESS_SHA="$(
              gh run list \
                --workflow "$GITHUB_WORKFLOW" \
                --branch "$BRANCH_NAME" \
                --status success \
                --json headSha,displayTitle \
                --limit 50 \
                --jq ".[] | select(.displayTitle | test(\"($INPUT_ENVIRONMENT)\")) | .headSha" \
                | head -n1
            )"

            if [ -n "$LAST_SUCCESS_SHA" ]; then
              BASE="$LAST_SUCCESS_SHA"

              echo ""
              echo "Last successful $INPUT_ENVIRONMENT deployment found:"
              echo "$BASE"

              if ! git rev-parse --verify "$BASE^{commit}" >/dev/null 2>&1; then
                echo ""
                echo "Fetching missing base commit..."
                git fetch origin "$BASE"

                if ! git rev-parse --verify "$BASE^{commit}" >/dev/null 2>&1; then
                  echo ""
                  echo "ERROR: Unable to resolve base commit:"
                  echo "$BASE"
                  exit 1
                fi
              fi

            else
              echo ""
              echo "ERROR: Could not find a previous successful $INPUT_ENVIRONMENT deployment."
              echo ""
              echo "This is expected for the first deployment of this environment."
              echo ""
              echo "Please provide either:"
              echo "  functions: HelloWorld,S3ListBuckets"
              echo "or:"
              echo "  base: <branch/ref/SHA>"
              echo ""
              exit 1
            fi
          fi

          # ------------------------------------------------------
          # 4.3 Final validation
          # ------------------------------------------------------

          if ! git rev-parse --verify "$BASE^{commit}" >/dev/null 2>&1; then
            echo ""
            echo "ERROR: Unable to resolve comparison base:"
            echo "$BASE"
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "Resolved base:"
          echo "$BASE"
          echo "=============================================="

          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      # ========================================================
      # 5. Detect changed functions  (git-only — no AWS)
      #
      # Detects ANY file change inside a Lambda folder.
      # A folder is a Lambda if it contains lambda_function.py
      # at its top level.
      # ========================================================

      - name: Detect changed functions
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Detecting changed functions"
          echo "=============================================="

          # ------------------------------------------------------
          # 5.1 Explicit function input
          # ------------------------------------------------------

          if [ -n "$INPUT_FUNCTIONS" ]; then
            echo ""
            echo "Explicit function list supplied."
            echo "Automatic change detection will be skipped."

            FUNCTIONS="$(
              printf '%s' "$INPUT_FUNCTIONS" |
                tr ',' '\n' |
                sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
                sed '/^$/d' |
                sort -u
            )"

            if [ -z "$FUNCTIONS" ]; then
              echo ""
              echo "ERROR: The functions input did not contain any function names."
              exit 1
            fi

            while IFS= read -r FUNCTION; do
              [ -z "$FUNCTION" ] && continue

              if ! printf '%s' "$FUNCTION" | grep -Eq '^[A-Za-z0-9_-]+$'; then
                echo ""
                echo "ERROR: Invalid function name:"
                echo "$FUNCTION"
                echo "Allowed characters: A-Z, a-z, 0-9, underscore, hyphen."
                exit 1
              fi

              if [ ! -f "$FUNCTION/lambda_function.py" ]; then
                echo ""
                echo "ERROR: Function does not exist:"
                echo "$FUNCTION/lambda_function.py"
                exit 1
              fi
            done <<< "$FUNCTIONS"

            echo ""
            echo "Functions selected explicitly:"
            echo "$FUNCTIONS"

            {
              echo "functions<<EOF"
              echo "$FUNCTIONS"
              echo "EOF"

              echo "changed_files<<EOF"
              echo ""
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "source=manual" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          # ------------------------------------------------------
          # 5.2 Automatic change detection
          # ------------------------------------------------------

          if [ -z "$BASE_SHA" ]; then
            echo ""
            echo "ERROR: No comparison base was resolved."
            echo "Please provide the 'base' input or explicit 'functions'."
            exit 1
          fi

          echo ""
          echo "Base:"
          echo "$BASE_SHA"
          echo ""
          echo "HEAD:"
          echo "$COMMIT_SHA"

          CHANGED_FILES="$(
            git diff \
              --name-only \
              "$BASE_SHA...HEAD"
          )"

          echo ""
          echo "Changed files (raw):"
          echo "----------------------------------------------"

          if [ -n "$CHANGED_FILES" ]; then
            echo "$CHANGED_FILES"
          else
            echo "No changed files."
          fi

          echo "----------------------------------------------"

          # ------------------------------------------------------
          # 5.3 Detect ALL changed files inside Lambda folders
          #
          # A top-level folder is a Lambda if it contains
          # lambda_function.py. ANY changed file inside such a
          # folder triggers deployment of that Lambda.
          # ------------------------------------------------------

          FUNCTIONS=""
          FILE_ROWS=""

          while IFS=$'\t' read -r STATUS FILE; do
            [ -z "$FILE" ] && continue

            # Strip CR characters (Windows runners may inject them)
            FILE="$(printf '%s' "$FILE" | tr -d '\r')"
            STATUS="$(printf '%s' "$STATUS" | tr -d '\r')"

            # Only files under a top-level folder
            case "$FILE" in
              */*)
                FUNCTION="$(printf '%s' "$FILE" | cut -d '/' -f 1)"
                ;;
              *)
                # File at repo root — ignore (README.md, .gitignore, etc.)
                continue
                ;;
            esac

            # Only treat as Lambda if the folder has lambda_function.py
            if [ ! -f "$FUNCTION/lambda_function.py" ]; then
              continue
            fi

            # Any file inside the Lambda folder counts
            FUNCTIONS="${FUNCTIONS}${FUNCTION}"$'\n'
            FILE_ROWS="${FILE_ROWS}${FUNCTION}"$'\t'"${STATUS}"$'\t'"${FILE}"$'\n'
          done < <(git diff --name-status "$BASE_SHA...HEAD")

          FUNCTIONS="$(
            printf '%s\n' "$FUNCTIONS" |
              sed '/^$/d' |
              sort -u
          )"

          echo ""
          echo "Detected functions:"
          echo "----------------------------------------------"

          if [ -n "$FUNCTIONS" ]; then
            echo "$FUNCTIONS"
          else
            echo "None"
          fi

          echo "----------------------------------------------"

          echo ""
          echo "Changed files inside Lambda folders:"
          echo "----------------------------------------------"

          if [ -n "$FILE_ROWS" ]; then
            printf '%b' "$FILE_ROWS"
          else
            echo "None"
          fi

          echo "----------------------------------------------"

          # ------------------------------------------------------
          # 5.4 No function changes
          # ------------------------------------------------------

          if [ -z "$FUNCTIONS" ]; then
            echo ""
            echo "No Lambda Function changes detected."

            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "source=diff" >> "$GITHUB_OUTPUT"

            {
              echo "functions<<EOF"
              echo ""
              echo "EOF"

              echo "changed_files<<EOF"
              echo ""
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

            exit 0
          fi

          {
            echo "functions<<EOF"
            echo "$FUNCTIONS"
            echo "EOF"

            echo "changed_files<<EOF"
            printf '%b' "$FILE_ROWS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "source=diff" >> "$GITHUB_OUTPUT"

      # ========================================================
      # 6. Resolve environment-specific credentials
      #
      # Switch on INPUT_ENVIRONMENT to pick the right region.
      # The AWS role ARN is shared between environments (OIDC).
      #
      # ⚠️ This step ONLY reads secrets and exports env vars.
      # It does NOT call AWS. No OIDC token is exchanged yet.
      #
      # Exports:
      #   AWS_ROLE_ARN  (shared)
      #   AWS_REGION    (env-specific)
      # to $GITHUB_ENV for later steps.
      # ========================================================

      - name: Resolve environment credentials
        shell: bash
        env:
          SECRET_AWS_ROLE_ARN:       ${{ secrets.AWS_ROLE_ARN }}
          SECRET_AWS_REGION_DEV:     ${{ secrets.AWS_REGION_DEV }}
          SECRET_AWS_REGION_STAGING: ${{ secrets.AWS_REGION_STAGING }}
          SECRET_AWS_REGION_PROD:    ${{ secrets.AWS_REGION_PROD }}
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Resolving credentials for: $INPUT_ENVIRONMENT"
          echo "=============================================="

          case "$INPUT_ENVIRONMENT" in
            dev)
              ROLE_ARN="$SECRET_AWS_ROLE_ARN"
              REGION="$SECRET_AWS_REGION_DEV"
              ;;
            staging)
              ROLE_ARN="$SECRET_AWS_ROLE_ARN"
              REGION="$SECRET_AWS_REGION_STAGING"
              ;;
            prod)
              ROLE_ARN="$SECRET_AWS_ROLE_ARN"
              REGION="$SECRET_AWS_REGION_PROD"
              ;;
            *)
              echo "ERROR: Unsupported environment: $INPUT_ENVIRONMENT"
              exit 1
              ;;
          esac

          if [ -z "$ROLE_ARN" ]; then
            echo "ERROR: Missing AWS_ROLE_ARN repo secret."
            exit 1
          fi

          if [ -z "$REGION" ]; then
            echo "ERROR: Missing AWS region for environment: $INPUT_ENVIRONMENT"
            echo "       Check repo secret AWS_REGION_DEV / AWS_REGION_STAGING / AWS_REGION_PROD."
            exit 1
          fi

          {
            echo "AWS_ROLE_ARN=$ROLE_ARN"
            echo "AWS_REGION=$REGION"
          } >> "$GITHUB_ENV"

          echo "Credentials resolved (not yet assumed):"
          echo "  Environment : $INPUT_ENVIRONMENT"
          echo "  Region      : $REGION"
          echo "  Role        : $ROLE_ARN"

      # ========================================================
      # 6b. Deployment information
      # ========================================================

      - name: Deployment information
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "AWS Lambda Functions - $INPUT_ENVIRONMENT"
          echo "=============================================="
          echo "Branch       : $BRANCH_NAME"
          echo "Commit       : $COMMIT_SHA"
          echo "Region       : $AWS_REGION"
          echo "Role         : $AWS_ROLE_ARN"
          echo "Manual input : ${INPUT_FUNCTIONS:-<none>}"
          echo "Base input   : ${INPUT_BASE:-<auto>}"
          echo "Has changes  : ${{ steps.changes.outputs.has_changes }}"
          echo "=============================================="

      # ========================================================
      # 7. Configure AWS credentials (OIDC) — ONLY IF CHANGES EXIST
      #
      # This is the first step that actually talks to AWS.
      # ========================================================

      - name: Configure AWS credentials (OIDC)
        id: configure-aws
        if: steps.changes.outputs.has_changes == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ========================================================
      # 7b. Verify AWS identity — ONLY IF CHANGES EXIST
      # ========================================================

      - name: Verify AWS identity
        id: verify-aws
        if: steps.changes.outputs.has_changes == 'true'
        shell: powershell
        run: |
          $id = aws sts get-caller-identity | ConvertFrom-Json
          Write-Host "Assumed ARN : $($id.Arn)"
          Write-Host "Account     : $($id.Account)"
          Write-Host "UserId      : $($id.UserId)"

          $roleName = ("${{ env.AWS_ROLE_ARN }}" -split '/')[-1]
          if ($id.Arn -notlike "*$roleName*") {
            throw "Unexpected identity: $($id.Arn). Expected role containing '$roleName'."
          }

      # ========================================================
      # 7c. Deploy functions — ONLY IF CHANGES EXIST
      # ========================================================

      - name: Deploy functions
        id: deploy
        if: steps.changes.outputs.has_changes == 'true'
        shell: powershell
        env:
          FUNCTIONS: ${{ steps.changes.outputs.functions }}
        run: |
          $ErrorActionPreference = "Continue"

          $deployed = @()
          $failed   = @()

          $env_name = "$env:INPUT_ENVIRONMENT"
          $region   = "$env:AWS_REGION"

          Write-Host "=============================================="
          Write-Host "Deploying Functions - $env_name"
          Write-Host "=============================================="

          $functions = $env:FUNCTIONS -split "`n" | Where-Object { $_.Trim() -ne "" }

          foreach ($function in $functions) {
            Write-Host ""
            Write-Host "----------------------------------------------"
            Write-Host "Deploying: $function ($env_name)"
            Write-Host "----------------------------------------------"

            try {
              $fnFull   = "$function-$env_name"
              $buildDir = "build\$function"
              $pkgPath  = "build\$function-$env_name.zip"

              if (Test-Path $buildDir) { Remove-Item $buildDir -Recurse -Force }
              if (Test-Path $pkgPath)  { Remove-Item $pkgPath  -Force }
              New-Item -ItemType Directory -Path $buildDir -Force | Out-Null

              # Copy function source
              Copy-Item -Path "$function\*" -Destination $buildDir -Recurse -Force

              # Strip local-only folders
              Get-ChildItem -Path $buildDir -Recurse -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -in @('__pycache__','.venv','venv','.pytest_cache','scripts','.git','tests') } |
                Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

              # Install dependencies if requirements.txt exists
              $reqFile = "$function\requirements.txt"
              if (Test-Path $reqFile) {
                Write-Host "Installing dependencies..." -ForegroundColor Cyan
                python -m pip install --upgrade pip | Out-Null
                python -m pip install -r $reqFile -t $buildDir `
                  --platform manylinux2014_x86_64 `
                  --only-binary=:all: `
                  --implementation cp `
                  --python-version 3.12 `
                  --upgrade
                if ($LASTEXITCODE -ne 0) { throw "pip install failed for $function" }
              }

              # Zip
              Compress-Archive -Path "$buildDir\*" -DestinationPath $pkgPath -Force
              $pkgFull = (Resolve-Path $pkgPath).Path
              $sizeKB  = [math]::Round((Get-Item $pkgFull).Length / 1KB, 1)
              Write-Host ("Package: {0} ({1} KB)" -f $pkgFull, $sizeKB) -ForegroundColor Green

              # Ensure function exists
              aws lambda get-function --function-name $fnFull --region $region 2>$null | Out-Null
              if ($LASTEXITCODE -ne 0) {
                throw "Lambda '$fnFull' not found in $region. Create it before deploying."
              }

              # Upload
              aws lambda update-function-code `
                --function-name $fnFull `
                --zip-file "fileb://$pkgFull" `
                --region $region

              if ($LASTEXITCODE -ne 0) { throw "update-function-code failed ($LASTEXITCODE)" }

              aws lambda wait function-updated `
                --function-name $fnFull `
                --region $region

              if ($LASTEXITCODE -ne 0) { throw "wait function-updated failed ($LASTEXITCODE)" }

              Write-Host "SUCCESS: $function" -ForegroundColor Green
              $deployed += $function
            }
            catch {
              Write-Host "FAILED: $function — $_" -ForegroundColor Red
              $failed += $function
            }
          }

          $deployedText = ($deployed -join "`n")
          $failedText   = ($failed   -join "`n")

          "deployed<<EOF`n$deployedText`nEOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "failed<<EOF`n$failedText`nEOF"     | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($failed.Count -gt 0) {
            Write-Host ""
            Write-Host "One or more functions failed." -ForegroundColor Red
            exit 1
          }

      # ========================================================
      # 8. Deployment summary (always)
      # ========================================================

      - name: Generate deployment summary
        if: always()
        shell: bash
        env:
          FUNCTIONS:              ${{ steps.changes.outputs.functions }}
          CHANGED_FILES:          ${{ steps.changes.outputs.changed_files }}
          DEPLOYED:               ${{ steps.deploy.outputs.deployed }}
          FAILED:                 ${{ steps.deploy.outputs.failed }}
          HAS_CHANGES:            ${{ steps.changes.outputs.has_changes }}
          CHANGE_SOURCE:          ${{ steps.changes.outputs.source }}
          BASE_SHA:               ${{ steps.base.outputs.base }}
          BASE_OUTCOME:           ${{ steps.base.outcome }}
          CHANGES_OUTCOME:        ${{ steps.changes.outcome }}
          AWS_CONFIGURE_OUTCOME:  ${{ steps.configure-aws.outcome }}
          AWS_VERIFY_OUTCOME:     ${{ steps.verify-aws.outcome }}
          DEPLOY_OUTCOME:         ${{ steps.deploy.outcome }}
        run: |
          set -u

          case "$INPUT_ENVIRONMENT" in
            prod)    TITLE_EMOJI="🚀"; TITLE_LABEL="Production" ;;
            staging) TITLE_EMOJI="🧪"; TITLE_LABEL="Staging" ;;
            *)       TITLE_EMOJI="🧰"; TITLE_LABEL="Dev" ;;
          esac

          {
            echo "# ${TITLE_EMOJI} Lambda Functions - ${TITLE_LABEL}"
            echo ""

            echo "## Deployment Information"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Environment | \`$INPUT_ENVIRONMENT\` |"
            echo "| Region | \`${AWS_REGION:-not resolved}\` |"
            echo "| Branch | \`$BRANCH_NAME\` |"
            echo "| Commit | \`$COMMIT_SHA\` |"
            echo "| Base | \`${BASE_SHA:-not required}\` |"
            echo "| Trigger | Manual |"
            echo "| Detection | \`${CHANGE_SOURCE:-not completed}\` |"
            echo ""

            if [ "${BASE_OUTCOME:-}" = "failure" ]; then

              echo "## ❌ Base Resolution Failed"
              echo ""
              echo "The workflow could not determine a comparison base."
              echo ""
              echo "For the first deployment, provide either:"
              echo ""
              echo "- \`functions: HelloWorld,S3ListBuckets\`"
              echo "- \`base: <branch/ref/SHA>\`"
              echo ""

            elif [ "${CHANGES_OUTCOME:-}" = "failure" ]; then

              echo "## ❌ Change Detection Failed"
              echo ""
              echo "The workflow could not determine which functions should be deployed."
              echo ""

            elif [ "${HAS_CHANGES:-false}" != "true" ]; then

              echo "## ℹ️ No Function Changes"
              echo ""
              echo "No Lambda Function changes were detected."
              echo ""
              echo "AWS credentials were not requested (change detection runs first)."
              echo ""

            else

              # --------------------------------------------------
              # Changed files per function (file-level detail)
              # --------------------------------------------------

              if [ -n "${CHANGED_FILES:-}" ]; then
                echo "## Changed Files"
                echo ""
                echo "| Function | Status | File |"
                echo "|---|---|---|"

                while IFS=$'\t' read -r FN STATUS FILE; do
                  [ -z "$FN" ] && continue

                  case "$STATUS" in
                    A*) SYMBOL="🆕 Added" ;;
                    M*) SYMBOL="✏️ Modified" ;;
                    D*) SYMBOL="🗑️ Deleted" ;;
                    R*) SYMBOL="🔀 Renamed" ;;
                    C*) SYMBOL="📄 Copied" ;;
                    *)  SYMBOL="$STATUS" ;;
                  esac

                  echo "| \`$FN\` | $SYMBOL | \`$FILE\` |"
                done <<< "$CHANGED_FILES"

                echo ""
              fi

              # --------------------------------------------------
              # AWS authentication status
              # --------------------------------------------------

              echo "## AWS Authentication"
              echo ""
              echo "| Step | Result |"
              echo "|---|---|"

              case "${AWS_CONFIGURE_OUTCOME:-not-run}" in
                success) echo "| Configure credentials | ✅ Assumed |" ;;
                skipped) echo "| Configure credentials | ⏭️ Skipped |" ;;
                failure) echo "| Configure credentials | ❌ Failed |" ;;
                *)       echo "| Configure credentials | \`${AWS_CONFIGURE_OUTCOME:-not-run}\` |" ;;
              esac

              case "${AWS_VERIFY_OUTCOME:-not-run}" in
                success) echo "| Verify identity | ✅ Verified |" ;;
                skipped) echo "| Verify identity | ⏭️ Skipped |" ;;
                failure) echo "| Verify identity | ❌ Failed |" ;;
                *)       echo "| Verify identity | \`${AWS_VERIFY_OUTCOME:-not-run}\` |" ;;
              esac

              echo ""

              # --------------------------------------------------
              # Deployment status per function
              # --------------------------------------------------

              echo "## Functions"
              echo ""
              echo "| Function | Status |"
              echo "|---|---|"

              if [ -n "${DEPLOYED:-}" ]; then
                while IFS= read -r FUNCTION; do
                  [ -z "$FUNCTION" ] && continue
                  echo "| \`$FUNCTION\` | ✅ Deployed |"
                done <<< "$DEPLOYED"
              fi

              if [ -n "${FAILED:-}" ]; then
                while IFS= read -r FUNCTION; do
                  [ -z "$FUNCTION" ] && continue
                  echo "| \`$FUNCTION\` | ❌ Failed |"
                done <<< "$FAILED"
              fi

              echo ""

              case "${DEPLOY_OUTCOME:-unknown}" in

                success)
                  echo "## ✅ Deployment Completed"
                  echo ""
                  echo "All selected functions were deployed successfully."
                  ;;

                failure)
                  echo "## ❌ Deployment Failed"
                  echo ""
                  echo "One or more functions failed to deploy."
                  ;;

                skipped)
                  echo "## ⏭️ Deployment Skipped"
                  echo ""
                  echo "No deployment was performed."
                  ;;

                cancelled)
                  echo "## 🛑 Deployment Cancelled"
                  echo ""
                  echo "The deployment was cancelled."
                  ;;

                *)
                  echo "## ⚠️ Deployment Did Not Complete"
                  echo ""
                  echo "The deployment step did not complete normally."
                  ;;

              esac

            fi

            echo ""
            echo "---"
            echo ""
            echo "Workflow: \`$GITHUB_WORKFLOW\`"
            echo "Run: \`$GITHUB_RUN_ID\`"

          } >> "$GITHUB_STEP_SUMMARY"